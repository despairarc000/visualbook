name: Knowledge System Doctor
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate knowledge links and routes
        run: python3 tools/doctor.py
      - name: Run knowledge unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Reproduce archived v0.3 compiler and fake playback tests
        run: python3 -m unittest discover -s knowledge-system/vault/history/v0.3/tests -v
      - name: Audit archive source byte integrity
        run: python3 tools/archive_integrity.py --strict

      - name: Validate AST-based code graph extraction
        run: python3 knowledge-system/graphify/scan_code.py --summary
