name: Android TTS Probe Debug APK
on:
  push:
    branches: [research/android-tts-probe, research/tagalog-offline-voice-comparison]
    paths:
      - research/experiments/android-audio/probe/**
      - .github/workflows/tts-probe-build.yml
  pull_request:
    paths:
      - research/experiments/android-audio/probe/**
      - .github/workflows/tts-probe-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35 SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: research/experiments/android-audio/probe
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: visualbook-tts-probe-debug
          path: research/experiments/android-audio/probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
