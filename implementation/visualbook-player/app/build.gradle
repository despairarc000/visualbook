plugins { id 'com.android.application' }

android {
    namespace 'com.visualbook.player'
    compileSdk 35
    defaultConfig {
        applicationId 'com.visualbook.player.series.v07'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-juan-pedro-series'
    }
    sourceSets {
        main {
            java.srcDirs += ['../story-core/src/main/java']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
