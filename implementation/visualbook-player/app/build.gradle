plugins { id 'com.android.application' }

android {
    namespace 'com.visualbook.player'
    compileSdk 35
    defaultConfig {
        applicationId 'com.visualbook.player.styles.v02'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-scoped-style-demo'
    }
    sourceSets {
        main {
            java.srcDirs += ['../story-core/src/main/java']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
