plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visualbook.ttsprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visualbook.ttsprobe.v3'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3-filipino-voice-compare'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
