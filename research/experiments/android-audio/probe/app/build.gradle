plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visualbook.ttsprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visualbook.ttsprobe.v2'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-switch-diagnostics'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
