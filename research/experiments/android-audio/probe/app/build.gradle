plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visualbook.ttsprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visualbook.ttsprobe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-experiment'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
